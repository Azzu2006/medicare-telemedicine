<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MediCare – Your Health, Our Priority. Telemedicine and Doctor Appointment Booking Application.">
  <meta name="theme-color" content="#1976D2">

  <!-- Open Graph -->
  <meta property="og:title" content="MediCare – Telemedicine Application">
  <meta property="og:description" content="Your Health, Our Priority. Fast, certified telemedicine consultations with top specialist doctors.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediCare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediCare – Telemedicine Application</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .loader-logo {
      width: 64px;
      height: 64px;
      background: #1976D2;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(25, 118, 210, 0.3);
      margin-bottom: 20px;
    }
    .loader-logo svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
    }
    .brand-title span {
      color: #1976D2;
    }
    .brand-tagline {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #1976D2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader-logo">
      <svg viewBox="0 0 24 24">
        <path d="M19 10.5h-4.5V6c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v4.5H7c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h4.5V18c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-4.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
      </svg>
    </div>
    <div class="brand-title">Medi<span>Care</span></div>
    <div class="brand-tagline">Your Health, Our Priority</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
